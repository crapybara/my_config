Section "InputClass"
    Identifier "libinput pointer speed"
    MatchIsPointer "on"
    Driver "libinput"
    Option "AccelSpeed" "0.5"
EndSection

Section "InputClass"
    Identifier "libinput touchpad settings"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "AccelSpeed" "0.5"
    Option "Tapping" "on"
    Option "ClickMethod" "clickfinger"
EndSection
